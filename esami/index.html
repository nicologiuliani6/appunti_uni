<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allenamento Esami</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<script src="data.js"></script>
<style>
:root { --bg:#f6f6f4; --panel:#fff; --fg:#1d1d1f; --muted:#6b6b70; --line:#dcdcdc; --acc:#2563eb; --sol:#b45309; --ok:#15803d; --ko:#dc2626; --okbg:#dcfce7; --kobg:#fee2e2; --code:#f1f1ef; }
@media (prefers-color-scheme: dark) { :root { --bg:#141416; --panel:#1e1e21; --fg:#e8e8ea; --muted:#9a9aa0; --line:#34343a; --acc:#60a5fa; --sol:#f59e0b; --ok:#4ade80; --ko:#f87171; --okbg:#14361f; --kobg:#3d1717; --code:#2a2a2e; } }
* { box-sizing:border-box; }
body { margin:0; font:15px/1.55 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; padding:8px 16px; flex-wrap:wrap; }
header h1 { font-size:16px; margin:0 10px 0 0; cursor:pointer; }
.tabs button, .btn { font:inherit; font-size:14px; padding:6px 12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); border-radius:8px; cursor:pointer; }
.tabs button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
.btn.pri { background:var(--acc); color:#fff; border-color:var(--acc); }
.btn:disabled { opacity:.5; cursor:default; }
#clock { margin-left:auto; font-variant-numeric:tabular-nums; font-weight:600; }
#clock.late { color:var(--ko); }
main { max-width:900px; margin:0 auto; padding:16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 18px; margin:12px 0; }
.list .card { display:flex; align-items:center; gap:12px; cursor:pointer; }
.list .card:hover { border-color:var(--acc); }
.list .t { flex:1; } .list .t b { display:block; }
.small { font-size:13px; color:var(--muted); }
.score { font-weight:700; font-variant-numeric:tabular-nums; }
.q h3 { margin:0 0 6px; font-size:15px; }
.q h3 .pts { float:right; font-weight:500; color:var(--muted); font-size:13px; }
.ctx { border-left:4px solid var(--acc); }
.opt { display:flex; gap:8px; align-items:flex-start; padding:6px 8px; border-radius:8px; margin:3px 0; cursor:pointer; }
.opt:hover { background:var(--code); }
.opt.ok { background:var(--okbg); } .opt.ko { background:var(--kobg); }
textarea { width:100%; min-height:140px; font:14px/1.5 ui-monospace,monospace; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); resize:vertical; }
input[type=text] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); width:180px; }
.res { margin-top:10px; padding:10px 14px; border-radius:8px; background:var(--code); }
.res.ok { background:var(--okbg); } .res.ko { background:var(--kobg); }
.sol { margin-top:10px; border-left:4px solid var(--sol); padding:4px 14px; }
.sol > b { color:var(--sol); }
.rub label { display:flex; gap:8px; padding:3px 0; cursor:pointer; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
pre { background:var(--code); padding:10px; border-radius:8px; overflow:auto; font-size:13px; }
code { font-family:ui-monospace,monospace; font-size:.92em; }
table { border-collapse:collapse; margin:8px 0; display:block; overflow:auto; }
td, th { border:1px solid var(--line); padding:4px 8px; vertical-align:top; }
blockquote { margin:8px 0; padding:2px 14px; border-left:3px solid var(--line); color:var(--muted); }
img { max-width:100%; }
.mermaid { background:#fff; border-radius:8px; padding:8px; overflow:auto; }
#total { position:sticky; bottom:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 18px; margin-top:16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
#total .big { font-size:22px; }
@media (max-width:600px) { header { padding:8px; } main { padding:8px; } .card { padding:12px; } }
</style>
</head>
<body>
<header>
  <h1 onclick="home()">📝 Allenamento esami</h1>
  <button class="btn" onclick="storico()">📜 Storico</button>
  <div class="tabs" id="tabs"></div>
  <span id="clock"></span>
</header>
<main id="app"></main>
<script>
const $ = s => document.querySelector(s);
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let cur = store.get("tab", 0), exam = null, timer = null;
mermaid.initialize({ startOnLoad: false, theme: "default", securityLevel: "loose" });

// markdown + formule: proteggo $...$ da marked, poi KaTeX
function md(s) {
  const math = [];
  s = s.replace(/\$\$[\s\S]+?\$\$|\$[^$\n]+?\$/g, m => `@@M${math.push(m) - 1}@@`);
  let h = marked.parse(s);
  h = h.replace(/@@M(\d+)@@/g, (_, i) => esc(math[i]));
  return h.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/g, (_, c) => `<div class="mermaid">${c}</div>`);
}
function typeset(el) {
  renderMathInElement(el, { delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }], throwOnError: false });
  const nodes = el.querySelectorAll(".mermaid:not([data-processed])");
  if (nodes.length) mermaid.run({ nodes }).catch(() => {});
}

function tabs() {
  $("#tabs").innerHTML = DATA.map((m, i) => `<button class="${i == cur ? "on" : ""}" onclick="cur=${i};store.set('tab',${i});home()">${m.name}</button>`).join("");
}

function home() {
  stopClock(); exam = null; tabs(); $("#clock").textContent = "";
  const m = DATA[cur], hist = store.get("hist", {});
  const kind = p => p.key.startsWith("progetto") ? "Progetti" : p.key.startsWith("banca") ? "Banca domande" : "Scritti e quiz";
  let last = "";
  const ok = studied(m), mir = mirato(m), nq = mir.blocks.filter(b => b.type != "contesto").length;
  const count = id => new Set(m.prove.flatMap(p => p.blocks.filter(b => b.topics?.includes(id)).map(b => b.q))).size;
  const top = `<div class="card ctx"><div class="t" style="flex:1"><b>🎯 Allenamento sui tuoi argomenti</b>
      <div class="small">${nq} domande uniche su ${ok.size} argomenti studiati</div>
      <details><summary class="small" style="cursor:pointer">Scegli argomenti (default dai tuoi appunti)</summary>
      ${m.topics.map(t => `<label style="display:block"><input type="checkbox" ${ok.has(t.id) ? "checked" : ""} onclick="event.stopPropagation()" onchange="setStudied('${t.id}', this.checked)"> ${esc(t.nome)} <span class="small">(${count(t.id)})</span></label>`).join("")}
      </details></div>
      <button class="btn pri" ${nq ? "" : "disabled"} onclick="run(mirato(DATA[cur]))">Inizia</button></div>`;
  $("#app").innerHTML = top + `<div class="list">` + (m.prove.length ? m.prove.map((p, i) => {
    const h3 = kind(p) != last ? `<h3 class="small" style="margin:18px 4px 4px">${last = kind(p)}</h3>` : "";
    return h3 + card(p, i);
  }).join("") : `<p class="small">Nessuna prova per questa materia.</p>`) + `</div>`;
  function card(p, i) {
    const h = hist[m.slug + "/" + p.key] || [], n = p.blocks.filter(b => b.type != "contesto").length;
    const best = h.length ? Math.max(...h.map(r => r.voto)) : null;
    return `<div class="card" onclick="start(${i})"><div class="t"><b>${esc(p.titolo)}</b>
      <span class="small">${n} domande · ${p.durata ? p.durata + " min" : "senza limite"} · ${h.length} tentativi</span></div>
      ${best != null ? `<span class="score">${best.toFixed(1)}/30</span>` : `<span class="small">mai fatta</span>`}</div>`;
  }
}

function start(i) { run(DATA[cur].prove[i]); }

// argomenti studiati: default da topics.json (dedotti dagli appunti), modificabili e salvati nel browser
function studied(m) { const s = store.get("studied", {})[m.slug]; return new Set(s ?? m.topics.filter(t => t.studiato).map(t => t.id)); }
function setStudied(id, on) {
  const m = DATA[cur], all = store.get("studied", {}), s = studied(m);
  on ? s.add(id) : s.delete(id); all[m.slug] = [...s]; store.set("studied", all); home();
}
const inProgram = (b, ok) => b.topics.length > 0 && b.topics.every(t => ok.has(t));

// prova virtuale: tutte le domande (senza duplicati) sugli argomenti studiati, col loro contesto
function mirato(m) {
  const ok = studied(m), seen = new Set(), blocks = [];
  for (const p of m.prove) {
    let ctx = null, pushed = null;
    for (const b of p.blocks) {
      if (b.type == "contesto") { ctx = b; continue; }
      const k = b.q + (b.options || []).join("|");
      if (!inProgram(b, ok) || seen.has(k)) continue;
      seen.add(k);
      if (ctx && pushed != ctx) blocks.push(pushed = ctx);
      blocks.push(b);
    }
  }
  return { key: "mirato", titolo: `Allenamento mirato · ${m.name}`, durata: 0, orig: [], blocks,
           fonte: "Solo domande sugli argomenti che hai già studiato (scegli gli argomenti dalla home)." };
}

function run(p) {
  const m = DATA[cur];
  exam = { m, p, ans: {}, done: {}, rub: {}, consegnata: false, ok: studied(m), t0: Date.now() };
  let qn = 0;
  $("#app").innerHTML = `<div class="card"><b>${esc(p.titolo)}</b><div class="small">${esc(p.fonte)}</div>
      ${p.orig.length ? `<div class="small">Originale: ${p.orig.map(f => `<a href="${f}" target="_blank">${f.split("/").pop()}</a>`).join(" · ")}</div>` : ""}
      <div class="row"><button class="btn" onclick="home()">← Indietro</button>
      ${p.durata ? `<button class="btn" id="tbtn" onclick="startClock(${p.durata})">⏱ Avvia timer ${p.durata}'</button>` : ""}</div></div>`
    + p.blocks.map((b, j) => b.type == "contesto" ? `<div class="card ctx">${md(b.md)}</div>` : question(b, j, ++qn)).join("")
    + `<div id="total"><button class="btn pri" onclick="consegna()">Consegna tutto</button><span id="tot"></span></div>`;
  typeset($("#app")); window.scrollTo(0, 0); total();
}

function question(b, j, n) {
  let body = "";
  if (b.type == "mcq") {
    const multi = b.correct.length > 1;
    body = (multi ? `<div class="small">(più risposte corrette)</div>` : "") + b.options.map((o, k) =>
      `<label class="opt" id="o${j}_${k}"><input type="${multi ? "checkbox" : "radio"}" name="q${j}" value="${k}" onchange="save(${j})"><span>${String.fromCharCode(97 + k)}) ${md(o).replace(/^<p>|<\/p>\s*$/g, "")}</span></label>`).join("");
  } else if (b.type == "num") {
    body = `<div class="row">Risposta: <input type="text" id="n${j}" oninput="save(${j})" placeholder="es. 0.75"></div>`;
  } else {
    body = `<textarea id="t${j}" oninput="save(${j})" placeholder="Scrivi qui la risposta (per i diagrammi: descrivili a parole, o disegnali su carta e scrivi 'su carta')"></textarea>`;
  }
  const off = exam.p.key != "mirato" && !inProgram(b, exam.ok) ? ` <span class="small" style="color:var(--sol)">· non ancora studiato</span>` : "";
  return `<div class="card q" id="q${j}"><h3>${n}.${off} <span class="pts">${b.pts} pt · ${b.type == "aperta" ? "risposta aperta" : b.type == "num" ? "numerica" : "scelta multipla"}</span></h3>
    ${md(b.q)}${b.md ? md(b.md) : ""}${body}
    <div class="row"><button class="btn" onclick="check(${j})">Verifica questa</button></div><div id="r${j}"></div></div>`;
}

function save(j) {
  const b = exam.p.blocks[j];
  if (b.type == "mcq") exam.ans[j] = [...document.querySelectorAll(`input[name=q${j}]:checked`)].map(x => +x.value);
  else exam.ans[j] = $((b.type == "num" ? "#n" : "#t") + j).value;
}

function check(j) {
  const b = exam.p.blocks[j], r = $("#r" + j), a = exam.ans[j];
  exam.done[j] = true;
  let html = "";
  if (b.type == "mcq") {
    const ok = a && a.length == b.correct.length && a.every(x => b.correct.includes(x));
    exam.rub[j] = ok ? b.pts : 0;
    b.options.forEach((_, k) => { const el = $(`#o${j}_${k}`); el.classList.toggle("ok", b.correct.includes(k)); el.classList.toggle("ko", !!a?.includes(k) && !b.correct.includes(k)); });
    html = `<div class="res ${ok ? "ok" : "ko"}">${ok ? "✔ Corretta" : "✘ Sbagliata"} — ${exam.rub[j]}/${b.pts} pt</div>`;
  } else if (b.type == "num") {
    const v = parseFloat(String(a ?? "").replace(",", ".")), ok = !isNaN(v) && Math.abs(v - b.ans) <= b.tol + 1e-9;
    exam.rub[j] = ok ? b.pts : 0;
    html = `<div class="res ${ok ? "ok" : "ko"}">${ok ? "✔ Corretta" : "✘ Sbagliata"} (atteso ${b.ans}${b.tol ? " ± " + b.tol : ""}) — ${exam.rub[j]}/${b.pts} pt</div>`;
  } else {
    const rubric = b.rubric.length ? b.rubric : [{ pts: b.pts, voce: "Risposta corretta e completa" }];
    html = `<div class="res"><b>Autovalutazione:</b> confronta con la soluzione e spunta le voci che hai centrato.
      <div class="rub">${rubric.map((r, k) => `<label><input type="checkbox" onchange="grade(${j})" id="g${j}_${k}"> <span><b>${r.pts}</b> — ${esc(r.voce)}</span></label>`).join("")}</div>
      <div class="row"><span id="gs${j}" class="score">0/${b.pts} pt</span>
      <button class="btn pri" id="ai${j}" onclick="aiGrade(${j})">🤖 Correggi con IA</button>
      <button class="btn" onclick="copyPrompt(${j})" title="Copia un prompt da incollare su claude.ai per una correzione dettagliata">📋 Copia prompt</button></div>
      <div id="aic${j}"></div></div>`;
    exam.rub[j] = exam.rub[j] ?? 0;
  }
  if (b.type == "aperta" || exam.rub[j] < b.pts)
    html += `<div class="row"><button class="btn" id="ex${j}" onclick="spiega(${j})">🧠 Spiegami${b.type == "aperta" ? " dove sbaglio" : " perché ho sbagliato"}</button></div><div id="exb${j}"></div>`;
  if (b.sol) html += `<div class="sol"><b>Soluzione</b>${md(b.sol)}</div>`;
  r.innerHTML = html;
  if (b.type == "aperta") grade(j);
  typeset(r); total();
}

function grade(j) {
  const b = exam.p.blocks[j], rubric = b.rubric.length ? b.rubric : [{ pts: b.pts }];
  exam.rub[j] = rubric.reduce((s, r, k) => s + ($(`#g${j}_${k}`)?.checked ? r.pts : 0), 0);
  $("#gs" + j).textContent = `${exam.rub[j]}/${b.pts} pt`;
  total();
}

// chiamata al server IA: errori comprensibili anche se il server è vecchio o non avviato
async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const t = await r.text();
  let d;
  try { d = JSON.parse(t); } catch { throw new Error(r.status == 404 || r.status == 501
    ? "Il server in esecuzione è una versione vecchia: fermalo (Ctrl+C) e rilancia python3 server.py"
    : `Risposta inattesa dal server (HTTP ${r.status})`); }
  if (d.errore) throw new Error(d.errore);
  return d;
}

async function aiGrade(j) {
  const b = exam.p.blocks[j], btn = $("#ai" + j), box = $("#aic" + j);
  const rubric = b.rubric.length ? b.rubric : [{ pts: b.pts, voce: "Risposta corretta e completa" }];
  if (!(exam.ans[j] || "").trim()) return box.innerHTML = `<p class="small">Scrivi prima una risposta.</p>`;
  btn.disabled = true; box.innerHTML = `<p class="small">Correzione in corso…</p>`;
  try {
    const d = await api("/api/grade", {
      materia: exam.m.name, contesto: exam.p.blocks.slice(0, j).filter(x => x.type == "contesto").map(x => x.md).join("\n\n"),
      domanda: b.q + "\n" + b.md, soluzione: b.sol, rubric, risposta: exam.ans[j] });
    d.voci.forEach((v, k) => { const c = $(`#g${j}_${k}`); if (c) c.checked = v; });
    grade(j);
    box.innerHTML = `<div class="sol"><b>Correzione IA</b> <span class="small">(${esc(d.modello)} — può sbagliare: ricontrolla le spunte)</span><p>${esc(d.commento)}</p></div>`;
  } catch (e) {
    box.innerHTML = `<p class="small">⚠️ ${location.protocol == "file:" ? "Apri la pagina con <code>python3 server.py</code> (http://localhost:8000), non come file." : esc(e.message)}</p>`;
  }
  btn.disabled = false;
}

// testo leggibile di risposta data / corretta, per le spiegazioni IA
function testi(b, j) {
  const a = exam.ans[j], L = k => `${String.fromCharCode(97 + k)}) ${b.options[k]}`;
  if (b.type == "mcq") return [(a || []).map(L).join("; "), b.correct.map(L).join("; ")];
  if (b.type == "num") return [a ?? "", `${b.ans}${b.tol ? " ± " + b.tol : ""}`];
  return [a ?? "", "vedi soluzione di riferimento"];
}

async function spiega(j) {
  const b = exam.p.blocks[j], btn = $("#ex" + j), box = $("#exb" + j), [risposta, corretta] = testi(b, j);
  btn.disabled = true; box.innerHTML = `<p class="small">Sto preparando la spiegazione…</p>`;
  try {
    const d = await api("/api/explain", {
      materia: exam.m.name, contesto: exam.p.blocks.slice(0, j).filter(x => x.type == "contesto").map(x => x.md).join("\n\n"),
      domanda: b.q + "\n" + b.md + (b.options ? "\n" + b.options.map((o, k) => `${String.fromCharCode(97 + k)}) ${o}`).join("\n") : ""),
      risposta, corretta, soluzione: b.sol });
    box.innerHTML = `<div class="sol"><b>🧠 Spiegazione</b> <span class="small">(${esc(d.modello)})</span>${md(d.spiegazione)}</div>`;
    typeset(box);
  } catch (e) {
    box.innerHTML = `<p class="small">⚠️ ${location.protocol == "file:" ? "Apri la pagina con <code>python3 server.py</code> (http://localhost:8000), non come file." : esc(e.message)}</p>`;
    btn.disabled = false;
  }
}

function copyPrompt(j) {
  const b = exam.p.blocks[j], ctx = exam.p.blocks.slice(0, j).filter(x => x.type == "contesto").map(x => x.md).join("\n\n");
  const txt = `Sei il docente di ${exam.m.name}. Correggi la mia risposta a questa domanda d'esame, con voto in punti su ${b.pts}, spiegando errori e mancanze.\n\n`
    + (ctx ? `CONTESTO:\n${ctx}\n\n` : "") + `DOMANDA:\n${b.q}\n${b.md}\n\nSOLUZIONE DI RIFERIMENTO:\n${b.sol}\n\n`
    + (b.rubric.length ? `GRIGLIA:\n${b.rubric.map(r => `- ${r.pts} pt: ${r.voce}`).join("\n")}\n\n` : "") + `MIA RISPOSTA:\n${exam.ans[j] || "(vuota)"}`;
  navigator.clipboard.writeText(txt).then(() => alert("Prompt copiato: incollalo su claude.ai"), () => prompt("Copia manualmente:", txt));
}

function total() {
  const qs = exam.p.blocks.map((b, j) => [b, j]).filter(([b]) => b.type != "contesto");
  const max = qs.reduce((s, [b]) => s + b.pts, 0), got = qs.reduce((s, [, j]) => s + (exam.rub[j] || 0), 0);
  const done = qs.filter(([, j]) => exam.done[j]).length, voto = max ? got / max * 30 : 0;
  $("#tot").innerHTML = done ? `<span class="big score">${got}/${max} pt</span> → <span class="big score">${voto.toFixed(1)}/30</span>
    <span class="small">(${done}/${qs.length} corrette${done < qs.length ? "; le non verificate valgono 0" : ""})</span>
    ${exam.consegnata ? `<span class="small">💾 salvato nello storico${qs.some(([b]) => b.type == "aperta") ? " (si aggiorna mentre correggi le aperte)" : ""}</span>` : ""}` : `<span class="small">${qs.length} domande · ${max} punti</span>`;
  if (exam.consegnata) salva(voto, got, max);
}

function consegna() {
  stopClock(); exam.consegnata = true;
  exam.p.blocks.forEach((b, j) => { if (b.type != "contesto" && !exam.done[j]) check(j); });
  total();
  $("#total").scrollIntoView({ behavior: "smooth" });
}

// storico nel browser (localStorage): ogni persona/browser ha il suo, niente di condiviso
function salva(voto, punti, max) {
  const hist = store.get("hist", {}), k = exam.m.slug + "/" + exam.p.key, list = (hist[k] ??= []);
  const rec = { voto, punti, max, data: exam.fine ??= new Date().toISOString(), titolo: exam.p.titolo,
                minuti: Math.round((Date.parse(exam.fine) - exam.t0) / 60000) };
  const i = list.findIndex(r => r.data == rec.data);
  i >= 0 ? list[i] = rec : list.push(rec);
  store.set("hist", hist);
}

function storico() {
  stopClock(); exam = null; $("#clock").textContent = "";
  const hist = store.get("hist", {}), rows = [];
  for (const [k, list] of Object.entries(hist)) {
    const [slug, key] = k.split("/"), m = DATA.find(x => x.slug == slug);
    for (const r of list) rows.push({ ...r, materia: m?.name ?? slug, titolo: r.titolo ?? m?.prove.find(p => p.key == key)?.titolo ?? key });
  }
  rows.sort((a, b) => b.data.localeCompare(a.data));
  const media = name => { const v = rows.filter(r => r.materia == name).map(r => r.voto); return v.length ? (v.reduce((a, b) => a + b) / v.length).toFixed(1) : "–"; };
  $("#tabs").innerHTML = DATA.map((m, i) => `<button onclick="cur=${i};store.set('tab',${i});home()">${m.name}</button>`).join("");
  $("#app").innerHTML = `<div class="card"><b>📜 Storico delle prove fatte</b>
      <div class="small">Salvato solo in questo browser: chi apre il sito da un altro browser/PC ha il proprio storico.</div>
      <div class="row">${DATA.map(m => `<span class="small">${esc(m.name)}: <b>${rows.filter(r => r.materia == m.name).length}</b> prove, media <b>${media(m.name)}</b>/30</span>`).join(" · ")}</div>
      <div class="row"><button class="btn" onclick="esporta()">⬇️ Esporta file</button>
      <label class="btn">⬆️ Importa file<input type="file" accept=".json" hidden onchange="importa(this.files[0])"></label>
      <button class="btn" onclick="if(confirm('Cancellare tutto lo storico di questo browser?')){store.set('hist',{});storico()}">🗑 Cancella</button></div></div>
    <div class="card">${rows.length ? `<table style="display:table;width:100%"><tr><th>Data</th><th>Materia</th><th>Prova</th><th>Punti</th><th>Voto</th><th>Tempo</th></tr>
      ${rows.map(r => `<tr><td>${new Date(r.data).toLocaleString("it-IT", { dateStyle: "short", timeStyle: "short" })}</td><td>${esc(r.materia)}</td><td>${esc(r.titolo)}</td>
        <td>${r.punti != null ? `${r.punti}/${r.max}` : ""}</td><td class="score" style="color:${r.voto >= 18 ? "var(--ok)" : "var(--ko)"}">${r.voto.toFixed(1)}</td><td>${r.minuti != null ? r.minuti + "'" : ""}</td></tr>`).join("")}</table>`
      : `<p class="small">Nessuna prova consegnata finora.</p>`}</div>`;
}

function esporta() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(store.get("hist", {}), null, 1)], { type: "application/json" }));
  a.download = `storico-esami-${new Date().toISOString().slice(0, 10)}.json`; a.click();
}
async function importa(f) {
  try {
    const add = JSON.parse(await f.text()), hist = store.get("hist", {});
    for (const [k, list] of Object.entries(add)) for (const r of list) if (!(hist[k] ??= []).some(x => x.data == r.data)) hist[k].push(r);
    store.set("hist", hist); storico();
  } catch { alert("File non valido"); }
}

function startClock(min) {
  stopClock();
  const end = Date.now() + min * 60000;
  const tick = () => {
    const s = Math.round((end - Date.now()) / 1000), a = Math.abs(s);
    $("#clock").textContent = (s < 0 ? "−" : "⏱ ") + new Date(a * 1000).toISOString().slice(11, 19);
    $("#clock").classList.toggle("late", s < 0);
  };
  tick(); timer = setInterval(tick, 1000);
  $("#tbtn") && ($("#tbtn").disabled = true);
}
function stopClock() { clearInterval(timer); timer = null; }

home();
</script>
</body>
</html>
