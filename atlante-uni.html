<!--
  ATLANTE UNI — mappa interattiva del percorso universitario
  ----------------------------------------------------------
  Tutto ciò che devi rigenerare è il blocco  const DATA = {...}  più sotto.
  Il resto (viewer) non va toccato. Fai rigenerare DATA a Claude Code
  leggendo le tue cartelle anno/materia. Schema dei dati documentato lì.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlante · percorso universitario</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/styles/vis-network.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.9/dist/vis-network.min.js"></script>

<style>
  :root{
    --bg:#0c1422;            /* notte / carta da atlante */
    --bg-soft:#121d31;
    --ink:#e8eef7;
    --ink-dim:#8497b4;
    --hair:#23344f;
    --card:#0f1a2c;
    --card-edge:#2a3f5f;
    --signature:#f3d27a;     /* oro: la tesi/Mnemo */
    --shadow:0 24px 60px -20px rgba(0,0,0,.7);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:"SF Mono","JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:
      radial-gradient(1200px 800px at 78% -10%, #15233c 0%, transparent 60%),
      radial-gradient(900px 700px at 8% 110%, #101a2e 0%, transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--sans); overflow:hidden;
  }
  #net{position:fixed; inset:0}

  /* ---- intestazione ---- */
  header{
    position:fixed; top:22px; left:26px; z-index:5; pointer-events:none;
    max-width:46ch;
  }
  header .kicker{
    font-family:var(--mono); font-size:11px; letter-spacing:.28em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 6px;
  }
  header h1{
    font-family:var(--serif); font-weight:600; font-size:30px; line-height:1;
    margin:0; letter-spacing:.01em;
  }
  header h1 em{color:var(--signature); font-style:italic}
  header p{font-size:12.5px; color:var(--ink-dim); margin:8px 0 0; line-height:1.5}

  /* ---- pannello controlli ---- */
  .controls{
    position:fixed; top:22px; right:22px; z-index:5; width:248px;
    background:linear-gradient(180deg,rgba(18,29,49,.92),rgba(12,20,34,.92));
    border:1px solid var(--hair); border-radius:14px; padding:14px 14px 12px;
    backdrop-filter:blur(10px); box-shadow:var(--shadow);
  }
  .controls .lab{
    font-family:var(--mono); font-size:10px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 8px;
  }
  .search{
    width:100%; background:var(--bg); border:1px solid var(--hair);
    color:var(--ink); border-radius:9px; padding:8px 10px; font-size:13px;
    font-family:var(--sans); outline:none; margin-bottom:14px;
  }
  .search:focus{border-color:var(--card-edge)}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
  .chip{
    font:500 11.5px/1 var(--sans); padding:6px 9px; border-radius:999px;
    border:1px solid var(--hair); background:transparent; color:var(--ink-dim);
    cursor:pointer; transition:.15s; user-select:none;
  }
  .chip:hover{color:var(--ink)}
  .chip[data-on="1"]{color:#0c1422; border-color:transparent}
  .legend{display:flex; flex-direction:column; gap:7px}
  .leg{
    display:flex; align-items:center; gap:9px; cursor:pointer;
    font-size:12px; color:var(--ink); padding:2px 0; user-select:none;
  }
  .leg .dot{width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 0 3px rgba(255,255,255,.04)}
  .leg[data-off="1"]{opacity:.32}
  .leg:hover{opacity:1; filter:brightness(1.1)}

  /* ---- scheda di catalogo (signature) ---- */
  .card{
    position:fixed; left:26px; bottom:24px; z-index:6; width:340px;
    background:
      repeating-linear-gradient(0deg, transparent 0 27px, rgba(255,255,255,.025) 27px 28px),
      var(--card);
    border:1px solid var(--card-edge); border-left:4px solid var(--signature);
    border-radius:4px; box-shadow:var(--shadow);
    transform:translateY(18px); opacity:0; pointer-events:none;
    transition:transform .22s ease, opacity .22s ease;
    font-family:var(--serif);
  }
  .card.show{transform:none; opacity:1; pointer-events:auto}
  .card .top{display:flex; justify-content:space-between; align-items:flex-start;
    padding:14px 16px 8px; border-bottom:1px solid var(--hair)}
  .card .ref{font-family:var(--mono); font-size:10px; letter-spacing:.18em;
    color:var(--ink-dim); text-transform:uppercase}
  .card .x{font-family:var(--sans); cursor:pointer; color:var(--ink-dim);
    font-size:18px; line-height:1; padding:0 2px}
  .card .x:hover{color:var(--ink)}
  .card .title{font-size:21px; line-height:1.15; padding:12px 16px 6px; font-weight:600}
  .card .meta{display:flex; gap:18px; padding:0 16px 12px; font-family:var(--sans)}
  .card .meta div{font-size:12px}
  .card .meta .k{font-family:var(--mono); font-size:9px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-dim); margin-bottom:3px}
  .card .body{padding:0 16px 14px; font-size:14px; line-height:1.5; color:#d4ddec;
    font-family:var(--sans); border-top:1px solid var(--hair); padding-top:12px}
  .card .links{padding:0 16px 16px}
  .card .links .k{font-family:var(--mono); font-size:9px; letter-spacing:.16em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 8px}
  .card .links .row{display:flex; flex-wrap:wrap; gap:6px}
  .card .links button{
    font:500 12px/1 var(--sans); cursor:pointer; padding:6px 10px; border-radius:7px;
    background:var(--bg-soft); border:1px solid var(--hair); color:var(--ink); transition:.15s}
  .card .links button:hover{border-color:var(--signature); color:var(--signature)}

  /* ---- mini barra in basso a destra ---- */
  .tools{position:fixed; right:22px; bottom:24px; z-index:5; display:flex; gap:8px}
  .tools button{
    font:500 12px/1 var(--sans); cursor:pointer; color:var(--ink-dim);
    background:rgba(18,29,49,.9); border:1px solid var(--hair); border-radius:9px;
    padding:9px 12px; backdrop-filter:blur(8px)}
  .tools button:hover{color:var(--ink); border-color:var(--card-edge)}

  @media (max-width:720px){
    header{max-width:none; right:26px}
    .controls{display:none}
    .card{left:14px; right:14px; width:auto; bottom:14px}
  }
</style>

<div id="net"></div>

<header>
  <p class="kicker">archivio del sapere · unibo</p>
  <h1>Atlante del <em>percorso</em></h1>
  <p>Ogni nodo è un argomento. Le linee piene legano i temi dentro una materia, quelle tratteggiate i ponti tra materie e con la tesi. Clicca un nodo per la scheda.</p>
</header>

<div class="controls">
  <input id="q" class="search" placeholder="Cerca argomento…" autocomplete="off">
  <p class="lab">Anni</p>
  <div id="years" class="chips"></div>
  <p class="lab">Materie</p>
  <div id="legend" class="legend"></div>
</div>

<div id="card" class="card">
  <div class="top"><span id="c-ref" class="ref"></span><span class="x" onclick="hideCard()">✕</span></div>
  <div id="c-title" class="title"></div>
  <div class="meta">
    <div><div class="k">Materia</div><span id="c-mat"></span></div>
    <div><div class="k">Anno</div><span id="c-anno"></span></div>
  </div>
  <div id="c-body" class="body"></div>
  <div id="c-actions" class="links" style="display:none">
    <div id="c-actions-row" class="row"></div>
    <div id="c-spiega" class="body" style="display:none"></div>
  </div>
  <div id="c-links" class="links" style="display:none">
    <p class="k">Collegamenti</p><div id="c-links-row" class="row"></div>
  </div>
</div>

<div class="tools">
  <button onclick="network.fit({animation:true})">Adatta vista</button>
  <button id="physBtn" onclick="togglePhysics()">Ferma fisica</button>
</div>

/* =========================  VIEWER  (non toccare)  ====================== */
const M = DATA.materie;
const nodeColor = id => M[DATA.nodi.find(n=>n.id===id).materia].colore;

const nodes = new vis.DataSet(DATA.nodi.map(n=>{
  const c = M[n.materia].colore, big = n.materia==="tesi";
  return {
    id:n.id, label:n.label, group:n.materia,
    shape:"dot", size: big?20:13,
    color:{background:c, border:c, highlight:{background:c,border:"#fff"}, hover:{background:c,border:"#fff"}},
    font:{color:"#dfe7f3", size:13, face:'ui-sans-serif, system-ui', strokeWidth:0,
          vadjust:2, bold: big?{color:"#f3d27a"}:undefined},
    borderWidth: big?2:1,
    _mat:n.materia, _anno:n.anno, _det:n.dettagli, _label:n.label
  };
}));
const edges = new vis.DataSet(DATA.archi.map((e,i)=>{
  const tr = e.tipo==="trasversale";
  return {
    id:"e"+i, from:e.from, to:e.to,
    dashes: tr?[4,5]:false,
    width: tr?1.2:1.6,
    color:{color: tr? "#5b7099" : nodeColor(e.from), opacity: tr?.55:.45,
           highlight:"#f3d27a", hover:"#aab8d4"},
    smooth:{type:"continuous", roundness:.25}, _tr:tr
  };
}));

const network = new vis.Network(document.getElementById("net"), {nodes,edges}, {
  physics:{ solver:"forceAtlas2Based",
    forceAtlas2Based:{gravitationalConstant:-48, centralGravity:.012, springLength:110, springConstant:.06, damping:.5},
    stabilization:{iterations:220}},
  interaction:{hover:true, tooltipDelay:120, navigationButtons:false, keyboard:false},
  edges:{selectionWidth:1.4},
});

/* ---- scheda al click ---- */
function showCard(id){
  const n = nodes.get(id), mat = M[n._mat];
  document.getElementById("c-ref").textContent = n._mat.toUpperCase()+" · "+id;
  document.getElementById("c-title").textContent = n._label;
  const ms = document.getElementById("c-mat"); ms.textContent = mat.nome; ms.style.color = mat.colore;
  document.getElementById("c-anno").textContent = n._anno;
  document.getElementById("c-body").textContent = n._det;
  // azioni: spiega + apri appunti
  setupActions(id, n._mat);
  // collegamenti
  const linked = DATA.archi.filter(e=>e.from===id||e.to===id).map(e=>e.from===id?e.to:e.from);
  const box = document.getElementById("c-links"), row = document.getElementById("c-links-row");
  row.innerHTML="";
  if(linked.length){
    box.style.display="block";
    [...new Set(linked)].forEach(t=>{
      const b=document.createElement("button");
      b.textContent = nodes.get(t)._label;
      b.onclick=()=>{ network.selectNodes([t]); focusNode(t); showCard(t); };
      row.appendChild(b);
    });
  } else box.style.display="none";
  document.getElementById("card").classList.add("show");
}
const GH = "https://github.com/nicologiuliani6/appunti_uni/blob/main/";
function setupActions(id, mat){
  const row = document.getElementById("c-actions-row");
  const box = document.getElementById("c-spiega");
  row.innerHTML = ""; box.style.display = "none"; box.textContent = "";
  const sp = DATA.spiega[id], src = DATA.fonti[mat];
  if(sp){
    const b = document.createElement("button");
    b.textContent = "Spiega";
    b.onclick = () => {
      const open = box.style.display === "block";
      box.textContent = sp; box.style.display = open ? "none" : "block";
      b.textContent = open ? "Spiega" : "Nascondi";
    };
    row.appendChild(b);
  }
  if(src){
    const a = document.createElement("button");
    a.textContent = "📄 Apri appunti";
    a.onclick = () => window.open(GH + encodeURI(src), "_blank");
    row.appendChild(a);
  }
  document.getElementById("c-actions").style.display = (sp || src) ? "block" : "none";
}
function hideCard(){ document.getElementById("card").classList.remove("show"); network.unselectAll(); }
function focusNode(id){ network.focus(id,{scale:1.15, animation:{duration:420, easingFunction:"easeInOutQuad"}}); }

network.on("click", p=>{ if(p.nodes.length){ showCard(p.nodes[0]); } else hideCard(); });
network.on("doubleClick", p=>{ if(p.nodes.length) focusNode(p.nodes[0]); });

/* ---- filtri anno ---- */
const annoSet = [...new Set(DATA.nodi.map(n=>n.anno))];
const offYears = new Set();
const yearsBox = document.getElementById("years");
annoSet.forEach(a=>{
  const c=document.createElement("span"); c.className="chip"; c.textContent=a; c.dataset.on="1";
  c.style.background="#22344f"; c.style.color="#e8eef7";
  c.onclick=()=>{ if(offYears.has(a)){offYears.delete(a);c.dataset.on="1";c.style.background="#22344f";c.style.color="#e8eef7";}
                  else{offYears.add(a);c.dataset.on="0";c.style.background="transparent";c.style.color="#8497b4";}
                  applyFilters(); };
  yearsBox.appendChild(c);
});

/* ---- legenda materie (click = isola) ---- */
const offMat = new Set();
const legend = document.getElementById("legend");
Object.entries(M).forEach(([id,m])=>{
  const r=document.createElement("div"); r.className="leg";
  r.innerHTML=`<span class="dot" style="background:${m.colore}"></span>${m.nome}`;
  r.onclick=()=>{ if(offMat.has(id)){offMat.delete(id);r.dataset.off="0";}
                  else{offMat.add(id);r.dataset.off="1";} applyFilters(); };
  legend.appendChild(r);
});

function applyFilters(){
  nodes.update(DATA.nodi.map(n=>({
    id:n.id, hidden: offYears.has(n.anno) || offMat.has(n.materia)
  })));
}

/* ---- ricerca ---- */
document.getElementById("q").addEventListener("input", e=>{
  const v=e.target.value.trim().toLowerCase(); if(!v) return;
  const hit = DATA.nodi.find(n=>n._label?.toLowerCase().includes(v) || n.label.toLowerCase().includes(v));
  if(hit){ network.selectNodes([hit.id]); focusNode(hit.id); showCard(hit.id); }
});
document.getElementById("q").addEventListener("keydown", e=>{ if(e.key==="Escape") hideCard(); });

/* ---- fisica on/off ---- */
let phys=true;
function togglePhysics(){ phys=!phys; network.setOptions({physics:{enabled:phys}});
  document.getElementById("physBtn").textContent = phys?"Ferma fisica":"Avvia fisica"; }
network.once("stabilizationIterationsDone", ()=>{ network.fit({animation:false}); });
